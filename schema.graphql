schema {
  query: Query
  mutation: Mutation
}

input AcceptInviteInput {
  email: String!
  name: String!
  password: String!
  token: String!
}

"""Represents the type of activity a user performed."""
enum ActivityType {
  LOGIN
  MEETING_ATTENDED
  PROJECT_CONTRIBUTION
  TASK_UPDATE
}

input AddProjectMemberInput {
  projectId: String!
  """Defaults to CONTRIBUTOR when omitted."""
  role: ProjectRole
  userId: String!
}

type AnalyticsOverview {
  activeServices: Int!
  perService: [ServiceAnalyticsRow!]!
