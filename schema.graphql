  """Organization to invite the person to"""
  organizationId: String!
  """Optional role to assign — defaults to VIEWER if omitted"""
  roleId: String
}

type CreateInviteLinkResponse {
  email: String!
  """
  Whether the invite email actually sent (e.g. false if Resend rejected it
  due to bad/expired credentials). The invite record itself is always
  created regardless — use resendInviteLink to retry once credentials are
  fixed. Previously this failure was silent (logged only); this field
  surfaces it to the caller.
  """
  emailSent: Boolean!
  expiresAt: String!
  inviteId: ID!
  inviteLink: String!
  invitedById: String!
  organizationId: String!
  roleId: String!
}

input CreateMembershipInput {
  organizationId: String!
  roleId: String!
  userId: String!
}

input CreateOrganizationInput {
  name: String!
}

input CreatePositionInput {
  departmentId: String!
  name: String!
}

input CreateProjectInput {
  description: String
  name: String!
  organizationId: String!
}

input CreateServiceInput {
  description: String
  domain: String!
  githubUrl: String
  goal: String
  name: String!
  platformLinks: [String!]
  platforms: [String!]
  serviceType: String
  slug: String!
  tags: [String!]
  uptime: Float
  url: String!
}

input CreateSessionInput {
  device: String
  userId: String!
}

input CreateTaskInput {
  assignedTeamId: String
  assignedUserId: String
